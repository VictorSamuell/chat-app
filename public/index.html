<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#00aff0">
  <title>Zap 2 — conectar</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/scripts/shared.js" defer></script>
  <script src="/scripts/auth.js" defer></script>
</head>
<body class="landing">
  <header class="site-header">
    <a class="small-brand" href="/" aria-label="Zap 2, início">Zap 2</a>
    <span>Conversas por convite</span>
  </header>
  <main class="home-main">
    <section id="start" class="start-card" aria-labelledby="signin-title">
      <a class="login-brand" href="/" aria-label="Zap 2"><span>Zap 2</span></a>
      <h1 id="signin-title">Que bom te ver por aqui.</h1>
      <p class="login-subtitle">Escolha um apelido e entre na conversa.</p>
      <div class="tabs" role="tablist" aria-label="Como entrar">
        <button id="create-tab" role="tab" aria-selected="true" aria-controls="create-panel">Criar uma sala</button>
        <button id="join-tab" role="tab" aria-selected="false" aria-controls="join-panel" tabindex="-1">Tenho um convite</button>
      </div>
      <form id="entry-form">
        <label for="nickname">Seu apelido</label>
        <input id="nickname" maxlength="24" autocomplete="nickname" placeholder="Como seus amigos te chamam?" required>
        <div id="create-panel" role="tabpanel" aria-labelledby="create-tab">
          <label for="room-name">Nome da sala</label>
          <input id="room-name" maxlength="60" placeholder="Ex.: amigos de sempre" required>
        </div>
        <div id="join-panel" role="tabpanel" aria-labelledby="join-tab" hidden>
          <label for="invite">Link ou código do convite</label>
          <input id="invite" placeholder="Cole o convite aqui" disabled>
        </div>
        <p id="entry-error" class="form-error" role="alert"></p>
        <button id="entry-submit" class="button primary wide" type="submit">Criar sala <span aria-hidden="true">↗</span></button>
      </form>
      <p class="card-footnote">Sem conta, sem senha. É só chegar.</p>
    </section>
    <section class="recent-section" aria-labelledby="recent-title">
      <div class="section-heading"><h2 id="recent-title">Conversas recentes</h2><span>Neste navegador</span></div>
      <div id="recent-rooms" class="recent-grid"></div>
    </section>
  </main>
  <footer class="site-footer"><p>Compartilhe o convite com seus amigos.<br>Quem tem o link pode entrar e ler o histórico.</p><span>Zap 2 · juntos, mesmo de longe.</span></footer>
  <div class="cloud cloud-one" aria-hidden="true"></div><div class="cloud cloud-two" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
